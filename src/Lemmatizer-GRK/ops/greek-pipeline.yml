name: $(Date:yyMMdd)$(Rev:.r)-GreekScraper
parameters:
  - name: testing
    displayName: "Run in Test Mode? (Pages 1-20)"
    type: boolean
    default: true
trigger: none
jobs:
- job: ScrapeGreekLibrary
  displayName: "Scrape Greek Library Job"
  timeoutInMinutes: 0
  pool:
    name: Default
  steps:
  # Setup Python
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'
      addToPath: true
    displayName: 'Setup Python 3.12'

  # Setup Virtual Environment, Install Dependencies, Run Scraper
  - powershell: |
      if (-not (Test-Path ".venv")) {
        Write-Host "Creating new virtual environment..."
        python -m venv .venv
      } else {
        Write-Host "Using existing virtual environment..."
      }
      Write-Host "Installing dependencies..."
      .\.venv\Scripts\python.exe -m pip install --upgrade pip
      .\.venv\Scripts\python.exe -m pip install -r src/Lemmatizer-GRK/etl/requirements.txt
      
      Write-Host "-- Scraper Configuration --"
      $outDir = "$(Build.SourcesDirectory)\src\Lemmatizer-GRK\out"
      
      if ('${{ parameters.testing }}' -eq 'True') {
        Write-Host "MODE: TEST RUN (Pages 1 - 10)"
        .\.venv\Scripts\python.exe src/Lemmatizer-GRK/tools/scrape_tables.py --start 1 --end 10 --lemma-concurrency 10 --delay 0.2
      } else {
        Write-Host "MODE: PRODUCTION RUN (Full Perseus Greek Library)"
        .\.venv\Scripts\python.exe src/Lemmatizer-GRK/tools/scrape_tables.py --start 1 --end 6828 --lemma-concurrency 10 --delay 0.2
      }

      Write-Host "Running Validation..."
      .\.venv\Scripts\python.exe src/Lemmatizer-GRK/tools/validate_scrape.py
    displayName: 'Run Greek Scraper'
    env:
      PYTHONIOENCODING: utf-8
  - task: DownloadSecureFile@1
    name: googleAuth
    displayName: 'Download Google Service Account JSON'
    inputs:
      secureFile: 'greek-lemmatizer-ce51f349a136.json'

  # 2. Run the Drive Uploader
  - powershell: |
      Write-Host "Installing Google Drive dependencies..."
      .\.venv\Scripts\python.exe -m pip install google-api-python-client google-auth

      Write-Host "Uploading scraped CSVs to Google Drive..."
      $jsonPath = "$(googleAuth.secureFilePath)"
      $folderId = "1vysIYLsUlikIM_IDj3N5YtG0dZgYF9d_" # <-- UPDATE THIS
      $outDir = "$(Build.SourcesDirectory)\src\Lemmatizer-GRK\out"
      
      .\.venv\Scripts\python.exe src/Lemmatizer-GRK/tools/upload_to_drive.py --service-account-json "$jsonPath" --folder-id "$folderId" --files "$outDir" --max-workers 5
    displayName: 'Deliver Data to Google Drive'