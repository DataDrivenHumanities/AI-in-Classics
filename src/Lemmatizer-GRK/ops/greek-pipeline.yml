name: $(Date:yyMMdd)$(Rev:.r)-GreekScraper
parameters:
  - name: testing
    displayName: "Run in Test Mode? (Pages 1-20)"
    type: boolean
    default: true
trigger: none
jobs:
- job: ScrapeGreekLibrary
  displayName: "Scrape Greek Library Job"
  timeoutInMinutes: 0
  pool:
    name: Default
  steps:
  # Setup Python
  # - task: UsePythonVersion@0
  #   inputs:
  #     versionSpec: '3.12'
  #     addToPath: true
  #   displayName: 'Setup Python 3.12'

  # Setup Virtual Environment, Install Dependencies, Run Scraper
  - powershell: |
      if (Test-Path ".venv") {
        Write-Host "Removing leftover broken environment..."
        Remove-Item -Recurse -Force ".venv"
      }
      Write-Host "Creating fresh virtual environment..."
      py -m venv .venv
      
      Write-Host "Installing dependencies..."
      .\.venv\Scripts\python.exe -m pip install --upgrade pip
      .\.venv\Scripts\python.exe -m pip install -r src/Lemmatizer-GRK/etl/requirements.txt
      
      Write-Host "-- Scraper Configuration --"
      $outDir = "$(Build.SourcesDirectory)\src\Lemmatizer-GRK\out"
      
      if ('${{ parameters.testing }}' -eq 'True') {
        Write-Host "MODE: TEST RUN (Pages 1 - 10)"
        .\.venv\Scripts\python.exe src/Lemmatizer-GRK/tools/scrape_tables.py --start 1 --end 10 --lemma-concurrency 10 --delay 0.2
      } else {
        Write-Host "MODE: PRODUCTION RUN (Full Perseus Greek Library)"
        .\.venv\Scripts\python.exe src/Lemmatizer-GRK/tools/scrape_tables.py --start 1 --end 6828 --lemma-concurrency 10 --delay 0.2
      }

      Write-Host "Running Validation..."
      .\.venv\Scripts\python.exe src/Lemmatizer-GRK/tools/validate_scrape.py
    displayName: 'Run Greek Scraper'
    env:
      PYTHONIOENCODING: utf-8

  # 1. Securely download the Google JSON key to the agent
  - task: DownloadSecureFile@1
    name: googleAuth
    displayName: 'Download Google Service Account JSON'
    inputs:
      secureFile: 'greek-lemmatizer-8ab75adb1dc6.json'

  # 2. Run the Drive Uploader
  - powershell: |
      Write-Host "Installing Google Drive dependencies..."
      .\.venv\Scripts\python.exe -m pip install google-api-python-client google-auth

      Write-Host "Uploading scraped CSVs to Google Drive..."
      $jsonPath = "$(googleAuth.secureFilePath)"
      $folderId = "1vysIYLsUlikIM_IDj3N5YtG0dZgYF9d_" 
      $outDir = "$(Build.SourcesDirectory)\src\Lemmatizer-GRK\out"
      
      # Force PowerShell and Python to use UTF-8 natively and unbuffer logs
      [console]::InputEncoding = [console]::OutputEncoding = New-Object System.Text.UTF8Encoding
      $env:PYTHONUTF8="1"
      $env:PYTHONUNBUFFERED="1"
      
      # 2>&1 merges stderr into stdout so PowerShell doesn't hide errors
      # (UPDATED to --max-workers 10 for much faster cloud uploading)
      .\.venv\Scripts\python.exe src/Lemmatizer-GRK/tools/upload_to_drive.py --service-account-json "$jsonPath" --folder-id "$folderId" --files "$outDir" --max-workers 10 2>&1
    displayName: 'Deliver Data to Google Drive'

  # 3. Clean up local files to save hard drive space
  - powershell: |
      Write-Host "Cleaning up local CSV files..."
      $outDir = "$(Build.SourcesDirectory)\src\Lemmatizer-GRK\out"
      if (Test-Path $outDir) {
        Remove-Item "$outDir\*.csv" -Force
        Write-Host "Cleanup complete! Hard drive space saved."
      }
    displayName: 'Clean Up Local Files'
    condition: always()